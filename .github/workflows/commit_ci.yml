name: Automatic Build on Commit

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  # Writing the compile-error check run below; reading logs otherwise needs a token.
  checks: write

jobs:
  build:
    name: Build CI
    runs-on: ubuntu-latest
    env:
      APK_OUTPUT_PATH: 'app/build/outputs/apk'
      COMMIT_MESSAGE: |+
        New push to GitHub!

        ${{ github.event.head_commit.message }}

        by ${{ github.event.head_commit.author.name }}
        ${{ github.event.head_commit.url }}
      COMMIT_URL: ${{ github.event.head_commit.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          java-package: jdk
          distribution: 'temurin'
          cache: 'gradle'

      - name: Test, lint and build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      # The run logs need authentication to read, the commit's check runs do not. When the build
      # breaks, publish the compiler errors there so they can be read without a token.
      - name: Publish compile errors on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          summary=$(grep -E '^e: |error:|Execution failed|FAILURE:' build.log | head -40 || true)
          if [[ -z "$summary" ]]; then
            summary=$(tail -60 build.log)
          fi
          jq -n --arg title "编译失败" --arg summary "$summary" \
            '{name: "compile-errors", head_sha: env.SHA, status: "completed", conclusion: "failure",
              output: {title: $title, summary: $summary}}' > payload.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -X POST "https://api.github.com/repos/${REPO}/check-runs" \
            --data @payload.json > /dev/null

      - name: Stop when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Name snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail
          version_name=$(sed -nE 's/^project\.app\.versionName="?([^"[:space:]]+)"?$/\1/p' gradle.properties)
          short_sha=${GITHUB_SHA:0:7}
          debug_source=$(find "${APK_OUTPUT_PATH}/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)
          snapshot_source=$(find "${APK_OUTPUT_PATH}/release" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$version_name"
          test -n "$debug_source"
          test -n "$snapshot_source"
          debug_target="${RUNNER_TEMP}/C17NotifyReplace-${version_name}-debug-${short_sha}.apk"
          snapshot_target="${RUNNER_TEMP}/C17NotifyReplace-${version_name}-snapshot-${short_sha}.apk"
          install -m 0644 "$debug_source" "$debug_target"
          install -m 0644 "$snapshot_source" "$snapshot_target"
          echo "DEBUG_APK_PATH=$debug_target" >> "$GITHUB_ENV"
          echo "SNAPSHOT_APK_PATH=$snapshot_target" >> "$GITHUB_ENV"

      - name: Upload Artifacts (Debug)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ env.DEBUG_APK_PATH }}
          name: C17NotifyReplace-debug-${{ github.sha }}
          if-no-files-found: error

      - name: Upload Artifacts (Snapshot)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ env.SNAPSHOT_APK_PATH }}
          name: C17NotifyReplace-snapshot-${{ github.sha }}
          if-no-files-found: error

      - name: Upload Snapshot Mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: app/build/outputs/mapping/release/mapping.txt
          name: C17NotifyReplace-snapshot-mapping-${{ github.sha }}
          if-no-files-found: error

      - name: Post Artifacts to Telegram
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${TG_BOT_TOKEN}" || -z "${TG_CHAT_ID}" ]]; then
            exit 0
          fi
          media=$(env -u TG_BOT_TOKEN -u TG_CHAT_ID python3 - <<'PY'
          import json
          import os

          message = os.environ["COMMIT_MESSAGE"]
          if len(message) > 1024:
              message = os.environ["COMMIT_URL"]
          print(json.dumps([
              {"type": "document", "media": "attach://debug"},
              {"type": "document", "media": "attach://snapshot", "caption": message},
          ]))
          PY
          )
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMediaGroup" \
            --form-string "chat_id=${TG_CHAT_ID}" \
            --form-string "media=${media}" \
            --form "debug=@${DEBUG_APK_PATH}" \
            --form "snapshot=@${SNAPSHOT_APK_PATH}"
